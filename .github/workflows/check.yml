name: Plugin prüfen
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: PHP-Syntax
        run: find mg-maintenance-studio -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript-Syntax
        run: |
          node --check mg-maintenance-studio/assets/admin.js
          node --check mg-maintenance-studio/assets/frontend.js
          node --check mg-maintenance-studio/assets/preview.js
      - name: Paket und Prüfsummen
        run: python3 scripts/build-package.py
